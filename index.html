<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rishab Kumar</title>
<meta name="description" content="Rishab Kumar. Co-founding Unizel.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: one screen of black. Name pinned top, a huge serif statement in the middle with a blinking block cursor,
     one sentence and three links pinned bottom. No boxes, no images. */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --soft: #bdbdbd;
    --dim: #858585;
    --rule: #2b2b2b;
    --display: "Instrument Serif", "Times New Roman", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html { height: 100%; background: var(--bg); }
  body {
    box-sizing: border-box;
    min-height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 3rem;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 0.8125rem;
    line-height: 1.7;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: max(2rem, env(safe-area-inset-top, 0px));
    padding-bottom: max(2.25rem, env(safe-area-inset-bottom, 0px));
  }
  .top, .bottom { min-width: 0; }
  .top {
    font-family: var(--display);
    font-size: clamp(1.875rem, 4vw, 3rem);
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.25rem, 9.5vw, 8rem);
    line-height: 0.98;
    letter-spacing: -0.02em;
    text-wrap: balance;
    overflow-wrap: break-word;
  }
  h1 em { font-style: italic; }
  .cursor {
    display: inline-block;
    width: 0.34em;
    height: 0.66em;
    margin-left: 0.12em;
    background: var(--fg);
    vertical-align: baseline;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .bottom {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5rem 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
  }
  .bottom p {
    margin: 0;
    max-width: 30rem;
    color: var(--soft);
  }
  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--dim);
    padding-bottom: 2px;
  }
  a:hover { border-bottom-color: var(--fg); }
  a:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>

<div class="top">Rishab Kumar</div>

<main>
  <h1>Teaching AI agents to keep the <em>books.</em><span class="cursor" aria-hidden="true"></span></h1>
</main>

<div class="bottom">
  <p>KPMG-trained, with a Master of Accountancy and all four CPA exam sections passed. I'm co-founding Unizel, where AI agents do real accounting work in simulated companies, graded to the cent.</p>
  <ul class="links">
    <li><a href="https://unizel.com/">Unizel</a></li>
    <li><a href="https://www.linkedin.com/in/rishab-kumar-737808289/">LinkedIn</a></li>
  </ul>
</div>

</body>
</html>
